    url: https://github.com/malekabd2019-cell/uneva-ac--esphome.git
    ref: main
    files:
      - packages/core.yaml # قلب المشروع - فيه كل الإعدادات (WiFi, OTA, API, المكيف...الخ)
      # - packages/leds.yaml
    refresh: 30s

# لوحة الـ ESP32 اللي بتفلش عليها (ESP32 DevKit 38-pin مع معالج ESP-32D)
esp32:
  board: esp32dev
  framework:
    type: arduino

