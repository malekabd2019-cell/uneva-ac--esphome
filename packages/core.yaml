          }

  # Настройка уровня режима генератора (GEN Mode)
  - platform: template
    name: "وضع المولد"
    id: gen_mode
    entity_category: config
    options:
      - "Off"
      - "L1"
      - "L2"
      - "L3"
    optimistic: true
    restore_value: true
    on_value:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_gen_mode(id(gen_mode).active_index().value());

climate:
