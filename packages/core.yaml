# ОБЯЗАТЕЛЬНО отключаем логгирование через UART
logger:
  baud_rate: 0

# Раздел настроек устройства:
# - Переключатели
switch:
  # Пищалка для подтверждения команд, по умолчанию выключена
  - name: "الصفارة (Beeper)"
    platform: template
    device_class: switch
    id: beep_mode
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_beeper_state(true);
    on_turn_off:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_beeper_state(false);
  
  # Индикатор уставки температуры на корпусе внутреннего блока, по умолчанию включен
  - name: "الشاشة (Display)"
    platform: template
    device_class: switch
    id: display_mode
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_display_state(true);
    on_turn_off:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_display_state(false);
  
  # Светодиодная индикация обмена данными с кондиционером, по умолчанию выключена
  - name: "مؤشر LED الاتصال"
    platform: template
    device_class: switch
    id: ledflash_mode
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_module_display_state(true);
    on_turn_off:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_module_display_state(false);
          
  - name: "التطبيق الفوري للإعدادات (Force)"
    platform: template
    device_class: switch
    id: force_mode
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_force_mode_state(true);
    on_turn_off:
      then:
        lambda: !lambda |-
          id(${device_name}climate).set_force_mode_state(false);

  # تفعيل/إيقاف مراقبة انقطاع الكهرباء العامة والتحويل التلقائي لوضع المولد
  - name: "مراقبة انقطاع الكهرباء (Grid Watch)"
    platform: template
    device_class: switch
    id: grid_watch_switch
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        lambda: !lambda |-
          id(grid_watch_enabled) = true;
          ESP_LOGI("GRID", "تم تفعيل مراقبة انقطاع الكهرباء");
    on_turn_off:
      then:
        lambda: !lambda |-
          id(grid_watch_enabled) = false;
          ESP_LOGI("GRID", "تم إيقاف مراقبة انقطاع الكهرباء");

# - Периодическая синхронизация состояния GEN Mode с реальным состоянием кондиционера
# (на случай если режим был изменён с оригинального пульта)
interval:
  - interval: 3s
    then:
      - lambda: |-
          uint32_t elapsed = millis() - id(last_grid_ping);
          // إذا مرّ أكثر من 15 ثانية بدون إشارة من "الحارس"، نعتبر الكهرباء العامة انقطعت
          if (id(grid_watch_enabled) && elapsed > 15000 && id(grid_ok) && id(last_grid_ping) != 0) {
            id(grid_ok) = false;
            ESP_LOGW("GRID", "انقطعت الكهرباء العامة - تفعيل GEN L1");
            id(${device_name}climate).set_gen_mode(1);
          }

  - interval: 5s
    then:
      lambda: |-
        uint8_t level = id(${device_name}climate).get_gen_mode();
        std::string opt;
        switch (level) {
          case 1: opt = "L1"; break;
          case 2: opt = "L2"; break;
          case 3: opt = "L3"; break;
          default: opt = "Off"; break;
        }
        if (id(gen_mode).state != opt) {
          id(gen_mode).publish_state(opt);
        }

  # - فحص مواقيت وضع المولد كل 20 ثانية (مستقل تمامًا عن Home Assistant)
  - interval: 20s
    then:
      - lambda: |-
          auto now = id(sys_time).now();
          if (!now.is_valid()) return;

          static const char* day_codes[8] = {"", "SUN","MON","TUE","WED","THU","FRI","SAT"};
          std::string today = day_codes[now.day_of_week];
          int32_t marker = now.day_of_year * 1440 + now.hour * 60 + now.minute;

          // موقت 1
          if (id(timer1_level).active_index().has_value() && id(timer1_level).active_index().value() != 0) {
            if (id(timer1_days).state.find(today) != std::string::npos) {
              if (now.hour == id(timer1_time).hour && now.minute == id(timer1_time).minute) {
                if (id(timer1_last_fired) != marker) {
                  id(timer1_last_fired) = marker;
                  int lvl = id(timer1_level).active_index().value() - 1;
                  ESP_LOGI("TIMER", "موقت 1: تفعيل المستوى %d", lvl);
                  id(${device_name}climate).set_gen_mode(lvl);
                }
              }
            }
          }
          // موقت 2
          if (id(timer2_level).active_index().has_value() && id(timer2_level).active_index().value() != 0) {
            if (id(timer2_days).state.find(today) != std::string::npos) {
              if (now.hour == id(timer2_time).hour && now.minute == id(timer2_time).minute) {
                if (id(timer2_last_fired) != marker) {
                  id(timer2_last_fired) = marker;
                  int lvl = id(timer2_level).active_index().value() - 1;
                  ESP_LOGI("TIMER", "موقت 2: تفعيل المستوى %d", lvl);
                  id(${device_name}climate).set_gen_mode(lvl);
                }
              }
            }
          }
          // موقت 3
          if (id(timer3_level).active_index().has_value() && id(timer3_level).active_index().value() != 0) {
            if (id(timer3_days).state.find(today) != std::string::npos) {
              if (now.hour == id(timer3_time).hour && now.minute == id(timer3_time).minute) {
                if (id(timer3_last_fired) != marker) {
                  id(timer3_last_fired) = marker;
                  int lvl = id(timer3_level).active_index().value() - 1;
                  ESP_LOGI("TIMER", "موقت 3: تفعيل المستوى %d", lvl);
                  id(${device_name}climate).set_gen_mode(lvl);
                }
              }
            }
          }
          // موقت 4
          if (id(timer4_level).active_index().has_value() && id(timer4_level).active_index().value() != 0) {
            if (id(timer4_days).state.find(today) != std::string::npos) {
              if (now.hour == id(timer4_time).hour && now.minute == id(timer4_time).minute) {
                if (id(timer4_last_fired) != marker) {
                  id(timer4_last_fired) = marker;
                  int lvl = id(timer4_level).active_index().value() - 1;
                  ESP_LOGI("TIMER", "موقت 4: تفعيل المستوى %d", lvl);
                  id(${device_name}climate).set_gen_mode(lvl);
                }
              }
            }
          }

